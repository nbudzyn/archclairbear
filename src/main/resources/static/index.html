<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchClairBear</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #08101c;
      --bg1: #111c31;
      --text: #ecf4ff;
      --muted: #a8b8d4;
      --accent: #7cd4ff;
      --frame: rgba(171, 191, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(124, 212, 255, 0.18), transparent 24%),
        radial-gradient(circle at 82% 20%, rgba(155, 255, 203, 0.12), transparent 22%),
        radial-gradient(circle at 50% 85%, rgba(107, 132, 255, 0.14), transparent 30%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .app-title {
      position: fixed;
      left: 20px;
      top: 18px;
      z-index: 2;
      margin: 0;
      font-size: 22px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
    }

    .graph-area {
      position: relative;
      width: 100vw;
      height: 100vh;
      border: 1px solid var(--frame);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .placeholder {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      padding: 18px 26px;
      border-radius: 999px;
      border: 1px solid rgba(124, 212, 255, 0.24);
      background: rgba(9, 14, 28, 0.5);
      color: var(--muted);
      font-size: clamp(16px, 2vw, 22px);
      letter-spacing: 0.01em;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(10px);
    }

    .placeholder strong {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <h1 class="app-title">ArchClairBear</h1>
  <main class="graph-area" aria-label="Graphfläche">
    <p class="placeholder">Platzhalter für den Graphen</p>
  </main>
</body>
</html>
