<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchClairBear</title>
  <link rel="stylesheet" href="/graph-app.css?v=package-boxes-14" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <h1>ArchClairBear</h1>
      <p>Die Ansicht lädt den Root-Graphen vom Server und rendert den ersten sichtbaren Package-Knoten mit Cytoscape.</p>
    </header>

    <div class="tag" aria-hidden="true">
      <strong>Live</strong> Package-Graph
    </div>

    <main class="graph-frame" aria-label="Graphvisualisierung">
      <div id="graph-status" class="graph-state" role="status" aria-live="polite">
        <span class="graph-state__title">Ladevorgang</span>
        <span class="graph-state__message" data-message>Graphdaten werden geladen ...</span>
      </div>

      <div id="graph-error" class="graph-state graph-state--error" role="alert" hidden>
        <span class="graph-state__title">Fehler</span>
        <span class="graph-state__message" data-message>Der Graph konnte nicht geladen werden.</span>
      </div>

      <div id="cy"></div>
    </main>
  </div>

  <script defer src="/webjars/cytoscape/3.33.1/dist/cytoscape.min.js"></script>
  <script defer src="/vendor/elkjs/elk.bundled.js"></script>
  <script type="module" src="/graph-app.js?v=package-boxes-14"></script>
</body>
</html>
