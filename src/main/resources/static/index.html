<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchClairBear</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #06101c;
      --bg1: #101c31;
      --panel: rgba(9, 14, 28, 0.74);
      --panel-border: rgba(171, 191, 255, 0.16);
      --text: #ecf4ff;
      --muted: #a8b8d4;
      --accent: #7cd4ff;
      --accent-strong: #ffb86b;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(124, 212, 255, 0.16), transparent 24%),
        radial-gradient(circle at 82% 20%, rgba(155, 255, 203, 0.12), transparent 22%),
        radial-gradient(circle at 50% 85%, rgba(107, 132, 255, 0.14), transparent 30%),
        linear-gradient(160deg, var(--bg0), var(--bg1));
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 20px;
    }

    .hero {
      position: absolute;
      left: 20px;
      top: 18px;
      z-index: 2;
      max-width: min(680px, calc(100vw - 40px));
      pointer-events: none;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(24px, 2.6vw, 34px);
      line-height: 1;
      letter-spacing: 0.01em;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .graph-frame {
      position: absolute;
      inset: 92px 20px 20px;
      border-radius: 28px;
      border: 1px solid var(--panel-border);
      background:
        linear-gradient(rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0.01)),
        radial-gradient(circle at center, rgba(255, 255, 255, 0.03), transparent 58%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), var(--shadow);
      overflow: hidden;
    }

    .graph-state {
      position: absolute;
      left: 20px;
      top: 20px;
      z-index: 2;
      max-width: min(520px, calc(100% - 40px));
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(124, 212, 255, 0.18);
      background: rgba(8, 13, 24, 0.8);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(12px);
      font-size: 13px;
      line-height: 1.45;
    }

    .graph-state[hidden] {
      display: none;
    }

    .graph-state--error {
      border-color: rgba(255, 152, 107, 0.3);
      color: #ffd9c2;
    }

    .graph-state__title {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .graph-state__message {
      display: block;
    }

    #cy {
      width: 100%;
      height: 100%;
    }

    .tag {
      position: absolute;
      right: 18px;
      top: 16px;
      z-index: 2;
      padding: 9px 13px;
      border-radius: 999px;
      border: 1px solid rgba(124, 212, 255, 0.22);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(12px);
    }

    .tag strong {
      color: var(--accent-strong);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <h1>ArchClairBear</h1>
      <p>Die Ansicht lädt den Root-Graphen vom Server und rendert den ersten Verzeichnis-Knoten mit Cytoscape.</p>
    </header>

    <div class="tag" aria-hidden="true">
      <strong>Live</strong> Root-Graph
    </div>

    <main class="graph-frame" aria-label="Graphvisualisierung">
      <div id="graph-status" class="graph-state" role="status" aria-live="polite">
        <span class="graph-state__title">Ladevorgang</span>
        <span class="graph-state__message" data-message>Graphdaten werden geladen ...</span>
      </div>

      <div id="graph-error" class="graph-state graph-state--error" role="alert" hidden>
        <span class="graph-state__title">Fehler</span>
        <span class="graph-state__message" data-message>Der Graph konnte nicht geladen werden.</span>
      </div>

      <div id="cy"></div>
    </main>
  </div>

  <script defer src="/webjars/cytoscape/3.33.1/dist/cytoscape.min.js"></script>
  <script defer src="/graph-app.js"></script>
</body>
</html>
