<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ArchClairBear</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111b2f;
      --text: #ecf3ff;
      --muted: #a9b7d0;
      --accent: #7cd4ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #13203a, var(--bg));
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(760px, 100%);
      padding: 32px;
      border-radius: 20px;
      background: rgba(17, 27, 47, 0.92);
      border: 1px solid rgba(124, 212, 255, 0.18);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.1;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(124, 212, 255, 0.12);
      border: 1px solid rgba(124, 212, 255, 0.24);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main>
    <h1>ArchClairBear</h1>
    <p>Der Server liefert diese Startseite aus. Damit ist der erste Schritt des Running Skeletons sichtbar und direkt im Browser prüfbar.</p>
    <p>Als nächstes folgt die minimale Client-Server-Schnittstelle für einen einzelnen Verzeichnis-Knoten.</p>
    <div class="badge">Running Skeleton: Startseite aktiv</div>
  </main>
</body>
</html>
